<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinewall Designer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>Cinewall <span>Designer</span></h1>
      <p>Parametric TV wall unit — all measurements in cm</p>
    </header>
    <div id="controls"></div>
  <footer id="credit">
    <div>by <a href="https://www.linkedin.com/in/andrecarlucci" target="_blank" rel="noopener noreferrer">André Carlucci</a></div>
    <div class="disclaimer">This software is provided "AS IS" without warranty of any kind. Verify all measurements before cutting.</div>
  </footer>
  </aside>

  <div id="main">
    <div id="tabs">
      <button class="tab active" data-pane="view3d">3D View</button>
      <button class="tab" data-pane="paneElev">Elevation</button>
      <button class="tab" data-pane="paneCut">Cut List</button>
      <div class="spacer"></div>
      <div class="tool" id="toolHistory">
        <button class="tiny" id="btnUndo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
        <button class="tiny" id="btnRedo" title="Redo (Ctrl+Shift+Z)" disabled>↷ Redo</button>
      </div>
      <div class="tool" id="tool3d">
        <label><input type="checkbox" id="chkTech"> Technical</label>
        <label><input type="checkbox" id="chkDims" checked> Dimensions</label>
      </div>
    </div>

    <div class="pane active" id="view3d">
      <canvas id="canvas3d"></canvas>
      <div id="hint3d">click&nbsp;niche&nbsp;to&nbsp;locate&nbsp;/&nbsp;open&nbsp;doors&nbsp;&amp;&nbsp;drawers&nbsp;·&nbsp;drag&nbsp;rotate&nbsp;·&nbsp;scroll&nbsp;zoom&nbsp;·&nbsp;right-drag / shift&nbsp;pan</div>
    </div>

    <div class="pane" id="paneElev">
      <div id="elevWrap">
        <div id="elevTools">
          <button id="btnElevPng" class="primary">Download PNG</button>
        </div>
        <canvas id="elevCanvas"></canvas>
      </div>
    </div>

    <div class="pane" id="paneCut">
      <div class="cutwrap" id="cutContent"></div>
    </div>
  </div>
</div>

<input type="file" id="fileImport" accept=".json,application/json" style="display:none">

<script src="js/state.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/elevation.js"></script>
<script src="js/cutlist.js"></script>
<script src="js/main.js"></script>

<!-- Cloudflare Web Analytics -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "594ab1d30dee4b97a2fdc87a0baf5c56"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
