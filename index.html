<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinewall Designer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#15161a; --panel:#1e2026; --panel2:#23262d; --line:#2e313a;
    --text:#e8e4dc; --muted:#9a978f; --oak:#d9a05b; --oak-dim:#a97b50;
    --draft:#6fa8c9; --warn:#e0a75f; --err:#e07a5f; --ok:#8fbf8f;
    --mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Liberation Mono",monospace;
    --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;overflow:hidden}

  #app{display:flex;height:100vh;width:100vw}

  /* ---------- Sidebar ---------- */
  #sidebar{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  #sidebar header{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  #sidebar header h1{font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  #sidebar header h1 span{color:var(--oak)}
  #sidebar header p{color:var(--muted);font-size:12px;margin-top:3px}
  #controls{flex:1;overflow-y:auto;padding:12px 14px 24px}
  #controls::-webkit-scrollbar{width:8px}
  #controls::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  #credit{flex:none;border-top:1px solid var(--line);padding:10px 16px 12px;background:var(--panel);
    font-size:11.5px;color:var(--muted);line-height:1.5}
  #credit a{color:var(--oak);text-decoration:none;font-weight:600}
  #credit a:hover{text-decoration:underline}
  #credit .disclaimer{margin-top:3px;font-size:10px;opacity:.75}

  .section{margin-bottom:14px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
  .section h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  .field input[type=number],.field select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;
    color:var(--text);padding:6px 7px;font-family:var(--mono);font-size:13px}
  .field select{font-family:var(--sans)}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--draft);outline-offset:1px}
  .check{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:8px;cursor:pointer}
  .check input{accent-color:var(--oak)}
  .fpcheck{font-size:12px;width:100%;flex-wrap:wrap}
  .fpcheck small{color:var(--muted);font-size:10px}

  .computed{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
    font-family:var(--mono);font-size:12px;color:var(--draft);line-height:1.7}
  .computed b{color:var(--text);font-weight:600}

  /* Row cards */
  .rowcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;
    transition:border-color .25s,box-shadow .25s}
  .rowcard.flash{border-color:var(--oak);box-shadow:0 0 0 2px rgba(217,160,91,.35)}
  .cell.flash{border-color:var(--oak);background:rgba(217,160,91,.10)}
  .rowcard .rhead{display:flex;align-items:center;gap:8px;padding:9px 11px;background:rgba(217,160,91,.06);
    border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .rowcard.collapsed .rhead{border-bottom:none}
  .rowcard.collapsed .rbody{display:none}
  .chev{color:var(--muted);font-size:10px;width:11px;text-align:center;flex:none}
  .rowcard .rhead .rname{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .rowcard .rhead .rname small{color:var(--muted);font-weight:400;font-size:10px;letter-spacing:.06em}
  .rname-input{width:100%;background:transparent;border:none;border-bottom:1px dashed transparent;
    color:var(--oak);font-size:13px;font-weight:600;letter-spacing:.03em;padding:1px 0;font-family:var(--sans)}
  .rname-input::placeholder{color:var(--text);opacity:.85}
  .rname-input:hover,.rname-input:focus{border-bottom-color:var(--line);outline:none}
  .rbody{padding:10px 11px}
  .rowtools{display:flex;align-items:center;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
  .badge{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--line)}
  .badge.ok{color:var(--ok);border-color:rgba(143,191,143,.4)}
  .badge.bad{color:var(--warn);border-color:rgba(224,167,95,.5)}

  .cell{border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:8px;background:var(--bg)}
  .cell .ctop{display:flex;gap:6px;align-items:flex-end}
  .cell .ctop .field{flex:1}
  .cell .ctop .field.wsm{max-width:78px}
  .cell .extra{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .cell .extra .field{flex:1;min-width:88px}
  .celltag{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}

  /* divider toggle map */
  .divmaplabel{font-size:10px;color:var(--muted);letter-spacing:.06em;margin-top:9px}
  .divmap{display:flex;align-items:stretch;height:36px;margin-top:5px;
    background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px;gap:0}
  .divbar{width:10px;min-width:10px;padding:0;border-radius:2px;cursor:pointer;
    border:1px dashed var(--line);background:transparent}
  .divbar.on{background:var(--oak);border:1px solid var(--oak)}
  .divbar:hover{border-color:var(--oak);box-shadow:0 0 0 1px var(--oak) inset}
  .divcell{display:flex;align-items:center;justify-content:center;min-width:6px;
    color:var(--muted);font-family:var(--mono);font-size:10px;user-select:none}

  button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);
    border-radius:6px;padding:6px 10px;font-size:12px;font-family:var(--sans)}
  button:hover{border-color:var(--oak);color:var(--oak)}
  button.primary{background:var(--oak);border-color:var(--oak);color:#1a1408;font-weight:600}
  button.primary:hover{filter:brightness(1.08);color:#1a1408}
  button.tiny{padding:3px 8px;font-size:11px}
  button.danger:hover{border-color:var(--err);color:var(--err)}
  .btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

  /* ---------- Main area ---------- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #tabs{display:flex;align-items:center;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 10px}
  #tabs .tab{padding:11px 16px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;background:none;border-radius:0;border-top:none;border-left:none;border-right:none}
  #tabs .tab.active{color:var(--oak);border-bottom-color:var(--oak)}
  #tabs .spacer{flex:1}
  #tabs .tool{display:flex;align-items:center;gap:8px;padding:6px 0}
  #tabs .tool label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}

  .pane{flex:1;position:relative;display:none;min-height:0}
  .pane.active{display:block}
  #view3d{overflow:hidden}
  #canvas3d{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #canvas3d:active{cursor:grabbing}
  #hint3d{position:absolute;bottom:10px;left:12px;font-size:11px;color:var(--muted);
    font-family:var(--mono);pointer-events:none;background:rgba(21,22,26,.55);padding:4px 8px;border-radius:5px}

  #paneElev{overflow:auto;background:var(--bg);padding:18px}
  #elevWrap{width:max-content;margin:0 auto} /* wider than the pane → margins collapse to 0 and it scrolls, never crops */
  #elevCanvas{background:#f5f2ea;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.45);display:block}
  #elevTools{margin-bottom:12px;display:flex;gap:8px;justify-content:center}

  #paneCut{overflow:auto;padding:22px}
  .cutwrap{max-width:820px;margin:0 auto}
  .cutwrap h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--oak);margin:18px 0 8px}
  table.cut{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
  table.cut th{font-family:var(--sans);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);padding:7px 9px;border-bottom:1px solid var(--line)}
  table.cut td{padding:6px 9px;border-bottom:1px solid rgba(46,49,58,.6)}
  table.cut td.num{text-align:right;color:var(--draft)}
  .cutnote{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.6;font-family:var(--sans)}

  /* export / paste modal */
  #exportModal{position:fixed;inset:0;background:rgba(10,11,14,.72);display:flex;
    align-items:center;justify-content:center;z-index:50;padding:20px}
  #exportModal .emcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:18px;width:min(620px,100%);max-height:86vh;display:flex;flex-direction:column;gap:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #exportModal h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--oak)}
  #exportModal p{font-size:12.5px;color:var(--muted);line-height:1.5}
  #exportModal code{font-family:var(--mono);color:var(--text);font-size:11.5px}
  #exportModal textarea{flex:1;min-height:220px;resize:vertical;background:var(--bg);
    border:1px solid var(--line);border-radius:6px;color:var(--text);
    font-family:var(--mono);font-size:11.5px;padding:9px;line-height:1.45}
  #exportModal .embtns{display:flex;gap:8px;justify-content:flex-end}
  #exportModal .emerr{color:var(--err);font-size:12px;min-height:14px}

  @media (max-width:820px){
    #app{flex-direction:column}
    #sidebar{width:100%;min-width:0;height:46vh;border-right:none;border-bottom:1px solid var(--line)}
    #main{height:54vh}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>Cinewall <span>Designer</span></h1>
      <p>Parametric TV wall unit — all measurements in cm</p>
    </header>
    <div id="controls"></div>
  <footer id="credit">
    <div>by <a href="https://www.linkedin.com/in/andrecarlucci" target="_blank" rel="noopener noreferrer">André Carlucci</a></div>
    <div class="disclaimer">This software is provided "AS IS" without warranty of any kind. Verify all measurements before cutting.</div>
  </footer>
  </aside>

  <div id="main">
    <div id="tabs">
      <button class="tab active" data-pane="view3d">3D View</button>
      <button class="tab" data-pane="paneElev">Elevation</button>
      <button class="tab" data-pane="paneCut">Cut List</button>
      <div class="spacer"></div>
      <div class="tool" id="tool3d">
        <label><input type="checkbox" id="chkTech"> Technical</label>
        <label><input type="checkbox" id="chkDims" checked> Dimensions</label>
      </div>
    </div>

    <div class="pane active" id="view3d">
      <canvas id="canvas3d"></canvas>
      <div id="hint3d">click&nbsp;niche&nbsp;to&nbsp;locate&nbsp;/&nbsp;open&nbsp;doors&nbsp;&amp;&nbsp;drawers&nbsp;·&nbsp;drag&nbsp;rotate&nbsp;·&nbsp;scroll&nbsp;zoom&nbsp;·&nbsp;right-drag / shift&nbsp;pan</div>
    </div>

    <div class="pane" id="paneElev">
      <div id="elevWrap">
        <div id="elevTools">
          <button id="btnElevPng" class="primary">Download PNG</button>
        </div>
        <canvas id="elevCanvas"></canvas>
      </div>
    </div>

    <div class="pane" id="paneCut">
      <div class="cutwrap" id="cutContent"></div>
    </div>
  </div>
</div>

<input type="file" id="fileImport" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* =====================================================================
   STATE
===================================================================== */
const CELL_TYPES = [
  ["open","Open niche"],["door","Door"],["door-push","Door (push to open)"],
  ["drawer","Drawer"],["tv","TV niche"],["tv-panel","TV with panel (flush)"],["fireplace","Electric fireplace"]
];
const HINGES=[["left","Left"],["right","Right"],["top","Top (lift-up)"],["bottom","Bottom (drop-down)"]];
const HINGE_ARROW={left:"◀",right:"▶",top:"▲",bottom:"▼"};
const DECOR = [["none","Empty"],["books","Books"],["objects","Objects"],["mixed","Books + objects"],
  ["soundbar","Soundbar"],["speaker1","1 speaker"],["speaker2","2 speakers (L/R)"],["speaker3","3 speakers (L/C/R)"]];
const TVS = [43,50,55,65,75,85];
const FINISHES = [["oak","Oak"],["walnut","Walnut"],["black","Matte black"],["white","White"],
  ["smoked","Smoked oak"],["ash","Light ash"],["slats","Walnut slats (acoustic)"],
  ["concrete","Concrete / microcement"],["marble","Marble"],["travertine","Travertine"],
  ["anthracite","Anthracite"],["greige","Greige"],["sage","Sage green"],["navy","Navy blue"]];
const EXTRA_FIN=[["match","Match main finish"],["dark","Dark (shadow)"]];
function finLabel(key){
  const f=EXTRA_FIN.concat(FINISHES).find(x=>x[0]===key);
  return f?f[1]:key;
}

function newCell(t){ return {type:t||"open", decor:"none", tv:65, tvGap:5, hinge:"left", setback:0, border:0, shelves:0, faceplate:false}; }

const FACEPLATE_TYPES={"open":1,"tv":1,"tv-panel":1,"fireplace":1}; // niches that can join the continuous face plate layer
function isFaceplate(c){ return !!c.faceplate && !!FACEPLATE_TYPES[c.type]; }
/* face-plate frame width for open niches: exactly the niche's front border value (0 = no covering) */
function fpFrame(c,cw,rh){
  return cellBorder(c,cw,rh); // already clamped to keep at least a 4 cm opening
}

/* niche recess setback: how far the niche's back is brought forward from the unit back */
function cellSetback(c){
  const v=Math.max(0, +(c.setback||0));
  return Math.min(v, Math.max(0, S.depth-5)); // always keep at least 5 cm of recess
}
/* niche front border: fixed trim around the opening, flush with the fronts */
function cellBorder(c,cw,rh){
  const v=Math.max(0, +(c.border||0));
  return Math.min(v, Math.max(0,(Math.min(cw,rh)-4)/2)); // keep at least a 4 cm opening
}
const SETBACK_TYPES={"open":1,"tv":1,"fireplace":1}; // recessed niches: setback + front border configurable
const SHELF_TYPES={"open":1,"door":1,"door-push":1};  // niches that can take internal horizontal shelves

/* flush TV-panel geometry: TV size from diagonal, opening = TV + reveal gap all round */
function tvPanelCalc(c,cw,rh){
  const gap=Math.max(0, c.tvGap!=null?+c.tvGap:5);
  const diag=(c.tv||65)*2.54, minB=3; // keep at least 3 cm of panel border
  let tw=Math.min(diag*0.872, cw-0.4-2*gap-2*minB);
  let th=Math.min(diag*0.49,  rh-0.4-2*gap-2*minB);
  tw=Math.max(10,tw); th=Math.max(8,th);
  return {gap, tw:Math.round(tw*10)/10, th:Math.round(th*10)/10,
          ow:Math.round((tw+2*gap)*10)/10, oh:Math.round((th+2*gap)*10)/10};
}

/* migrate older saved designs: door-l / door-r → door + hinge */
function migrateDesign(d){
  (d.rows||[]).forEach(r=>(r.cols||[]).forEach(col=>{
    const c=col.c||{};
    if(c.type==="door-l"){ c.type="door"; c.hinge="left"; }
    else if(c.type==="door-r"){ c.type="door"; c.hinge="right"; }
    if(!c.hinge) c.hinge="left";
  }));
  return d;
}

function defaultState(){
  return {
    unitWidth:320, depth:40, thickness:1.8, plinth:6, plinthRecess:2, backPanel:true, finish:"oak",
    backFinish:"dark", plinthFinish:"dark",
    rows:[ // bottom → top
      {name:"Base cabinets", height:45, cols:[
        {w:0,c:newCell("drawer")},{w:0,c:newCell("fireplace")},{w:0,c:newCell("drawer")}
      ]},
      {name:"Media wall", height:80, cols:[ {w:0,c:newCell("tv")} ]},
      {name:"Display shelves", height:35, cols:[
        {w:0,c:(()=>{const x=newCell("open");x.decor="books";return x})()},
        {w:0,c:newCell("door")},
        {w:0,c:(()=>{const x=newCell("open");x.decor="objects";return x})()},
        {w:0,c:(()=>{const x=newCell("open");x.decor="mixed";return x})()}
      ]}
    ]
  };
}
/* ---------- persistence (localStorage autosave) ---------- */
const SAVE_KEY="cinewall-designer-v1";
let storageOK=true;
function loadSaved(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){ const d=JSON.parse(raw); if(d && d.rows && d.unitWidth) return migrateDesign(d); }
  }catch(e){ storageOK=false; }
  return null;
}
let S = loadSaved();
if(!S){ S=defaultState(); S.rows.forEach((r,i)=>equalizeRow(i,true)); }
let expandedRow = S.rows.length ? S.rows.length-1 : null; // accordion: only one row card open (top row first)

let saveTimer=0;
function saveState(){
  if(!storageOK) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{
      localStorage.setItem(SAVE_KEY,JSON.stringify(S));
      const el=document.getElementById("saveStatus");
      if(el) el.textContent="Autosaved ✓ "+new Date().toTimeString().slice(0,5);
    }catch(e){ storageOK=false; updateSaveStatus(); }
  },350);
}
function updateSaveStatus(){
  const el=document.getElementById("saveStatus");
  if(el) el.textContent = storageOK
    ? "Autosaves to this browser on every change."
    : "Autosave unavailable in this environment — use Export JSON to keep your design.";
}

/* ---------- derived helpers ---------- */
function totalHeight(){ // plinth + bottom panel + rows + shelves/top
  return S.plinth + S.thickness + S.rows.reduce((a,r)=>a + r.height + S.thickness, 0);
}
function plinthRecess(){ // front setback of the plinth from the unit's front plane
  const v = S.plinthRecess!=null ? +S.plinthRecess : 2;
  return Math.min(Math.max(0,v), Math.max(0, S.depth-2));
}
function ensureDividers(row){
  // dividers[0] = left outer side, dividers[n] = right outer side, in-between = internal
  const need=row.cols.length+1;
  if(!Array.isArray(row.dividers)){ row.dividers=Array(need).fill(true); return; }
  if(row.dividers.length!==need){
    const L=row.dividers[0]!==false, R=row.dividers[row.dividers.length-1]!==false;
    const inner=row.dividers.slice(1,-1).map(v=>v!==false);
    while(inner.length<need-2) inner.push(true);
    inner.length=Math.max(0,need-2);
    row.dividers=[L,...inner,R];
  }
}
function rowAvail(row){ // interior width available for niches in a row
  ensureDividers(row);
  const nd=row.dividers.reduce((a,b)=>a+(b?1:0),0);
  return S.unitWidth - nd*S.thickness;
}
function rowSum(row){ return row.cols.reduce((a,c)=>a+c.w,0); }
function normWidths(row){ // widths scaled to exactly fill available space
  const avail = rowAvail(row), sum = rowSum(row) || 1;
  return row.cols.map(c => c.w * avail / sum);
}
function equalizeRow(i, silent){
  const row = S.rows[i], avail = rowAvail(row);
  const w = Math.round(avail / row.cols.length * 10)/10;
  row.cols.forEach(c=>c.w=w);
  // absorb rounding in last column
  row.cols[row.cols.length-1].w = Math.round((avail - w*(row.cols.length-1))*10)/10;
  if(!silent){ renderSidebar(); scheduleRebuild(); }
}
const MIN_COL_W = 5;
function setColumnWidth(i, j, v){
  const row=S.rows[i], avail=rowAvail(row), n=row.cols.length;
  if(n===1){ row.cols[0].w=Math.round(avail*10)/10; return; }
  // clamp the edited column so every other column keeps at least MIN_COL_W
  v=Math.max(MIN_COL_W, Math.min(v, avail-(n-1)*MIN_COL_W));
  v=Math.round(v*10)/10;
  row.cols[j].w=v;
  // redistribute the remainder: each sibling keeps at least MIN_COL_W,
  // and the slack above that is shared proportionally to their current widths
  const others=row.cols.filter((_,k)=>k!==j);
  const rest=Math.round((avail-v)*10)/10;
  const extra=rest-others.length*MIN_COL_W;
  const weights=others.map(c=>c.w);
  const wsum=weights.reduce((a,b)=>a+b,0);
  let acc=0;
  others.forEach((c,k)=>{
    let w;
    if(k===others.length-1) w=Math.round((rest-acc)*10)/10; // absorb rounding
    else {
      const share = wsum>0 ? extra*weights[k]/wsum : extra/others.length;
      w=Math.round((MIN_COL_W+share)*10)/10;
    }
    c.w=w; acc=Math.round((acc+w)*10)/10;
  });
  // safeguard: if rounding left the last sibling under the minimum, borrow from the widest one
  const last=others[others.length-1];
  if(last.w<MIN_COL_W && others.length>1){
    const donor=others.slice(0,-1).sort((a,b)=>b.w-a.w)[0];
    donor.w=Math.round((donor.w-(MIN_COL_W-last.w))*10)/10;
    last.w=MIN_COL_W;
  }
}
function syncRowWidthInputs(i, skipJ){
  document.querySelectorAll(`input[data-a="cellw"][data-row="${i}"]`).forEach(inp=>{
    const j=+inp.dataset.col;
    if(j!==skipJ) inp.value=fmt(S.rows[i].cols[j].w);
  });
}
function fmt(n){ return (Math.round(n*10)/10).toString(); }
function rowName(i){ const n=(S.rows[i].name||"").trim(); return n || ("Row "+(i+1)); }
function esc(s){ return String(s).replace(/[&<>"']/g,
  m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

===================================================================== */
const controls = document.getElementById("controls");

function renderSidebar(){
  let h = `
  <div class="section">
    <h2>Overall unit</h2>
    <div class="grid3">
      <div class="field"><label>Width (cm)</label><input type="number" step="0.5" min="30" value="${S.unitWidth}" data-g="unitWidth"></div>
      <div class="field"><label>Depth (cm)</label><input type="number" step="0.5" min="15" value="${S.depth}" data-g="depth"></div>
      <div class="field"><label>Plinth (cm)</label><input type="number" step="0.5" min="0" value="${S.plinth}" data-g="plinth"></div>
    </div>
    <div class="grid3" style="margin-top:8px">
      <div class="field"><label>Panel thickness (cm)</label><input type="number" step="0.1" min="1" max="4" value="${S.thickness}" data-g="thickness"></div>
      <div class="field"><label>Plinth recess (cm)</label><input type="number" step="0.5" min="0" value="${S.plinthRecess!=null?S.plinthRecess:2}" data-g="plinthRecess"></div>
      <div class="field"><label>Finish</label><select data-g="finish">${FINISHES.map(f=>`<option value="${f[0]}"${S.finish===f[0]?" selected":""}>${f[1]}</option>`).join("")}</select></div>
    </div>
    <div class="grid2" style="margin-top:8px">
      <div class="field"><label>Back panel finish</label><select data-g="backFinish">
        ${EXTRA_FIN.concat(FINISHES).map(f=>`<option value="${f[0]}"${(S.backFinish||"dark")===f[0]?" selected":""}>${f[1]}</option>`).join("")}</select></div>
      <div class="field"><label>Plinth finish</label><select data-g="plinthFinish">
        ${EXTRA_FIN.concat(FINISHES).map(f=>`<option value="${f[0]}"${(S.plinthFinish||"dark")===f[0]?" selected":""}>${f[1]}</option>`).join("")}</select></div>
    </div>
    <label class="check"><input type="checkbox" data-g="backPanel"${S.backPanel?" checked":""}> Back panel (6&nbsp;mm)</label>

  <div class="section" style="background:none;border:none;padding:4px 2px 0">

  </div>`;

  for(let i=S.rows.length-1;i>=0;i--){
    const row=S.rows[i], avail=rowAvail(row), sum=rowSum(row);
    const ok = Math.abs(sum-avail)<0.06;
    const open = (expandedRow===i);
    h += `
    <div class="rowcard${open?"":" collapsed"}" data-row="${i}">
      <div class="rhead" title="${open?"Collapse":"Expand"} row">
        <span class="chev">${open?"▾":"▸"}</span>
        <div class="rname">
          <input type="text" class="rname-input" maxlength="40" placeholder="Row ${i+1}"
            value="${esc(row.name||"")}" data-a="rowname" data-row="${i}"
            aria-label="Name for row ${i+1}">
          <small>Row ${i+1} · ${i===0?"bottom":(i===S.rows.length-1?"top":"middle")} · ${fmt(row.height)} cm · ${row.cols.length} niche${row.cols.length>1?"s":""}</small>
        </div>
        <button class="tiny" data-a="rowup" data-row="${i}" title="Move up" ${i===S.rows.length-1?"disabled":""}>↑</button>
        <button class="tiny" data-a="rowdown" data-row="${i}" title="Move down" ${i===0?"disabled":""}>↓</button>
        <button class="tiny danger" data-a="delrow" data-row="${i}" title="Delete row" ${S.rows.length<2?"disabled":""}>✕</button>
      </div>
      <div class="rbody">
        <div class="grid2">
          <div class="field"><label>Niche height (cm)</label>
            <input type="number" step="0.5" min="5" value="${row.height}" data-a="rowh" data-row="${i}"></div>
          <div class="field"><label>Columns</label>
            <div style="display:flex;gap:5px">
              <button class="tiny" data-a="delcol" data-row="${i}" ${row.cols.length<2?"disabled":""}>−</button>
              <input type="number" readonly value="${row.cols.length}" style="text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--text);width:100%;font-family:var(--mono)">
              <button class="tiny" data-a="addcol" data-row="${i}">+</button>
            </div></div>
        </div>
        <div class="rowtools">
          <span class="badge ${ok?"ok":"bad"}" data-badge="${i}">Σ ${fmt(sum)} / ${fmt(avail)} cm${ok?"":" → scaled"}</span>
          <button class="tiny" data-a="equalize" data-row="${i}">Equalize</button>

  h += `
  <div class="btnrow">
    <button class="primary" data-a="addrow">+ Add row on top</button>
    <button data-a="reset">Reset example</button>

  <div class="section" style="margin-top:14px">
    <h2>Project file</h2>

    <div class="computed" id="saveStatus" style="border-top:none;padding-top:6px;color:var(--muted)"></div>

function divMapHTML(i){
  const row=S.rows[i]; ensureDividers(row);
  const widths=normWidths(row);
  let h="";
  for(let j=0;j<row.cols.length;j++){
    h+=divBar(i,j,row.dividers[j]);
    h+=`<div class="divcell" style="flex-grow:${Math.max(widths[j],1)}" title="${fmt(widths[j])} cm">
      <span>${String.fromCharCode(65+j)}</span></div>`;
  }
  h+=divBar(i,row.cols.length,row.dividers[row.cols.length]);
  return h;
}
function divBar(i,b,on){
  const n=S.rows[i].cols.length;
  const what=b===0?"left side panel":(b===n?"right side panel":"divider between "+String.fromCharCode(64+b)+" and "+String.fromCharCode(65+b));
  return `<button type="button" class="divbar${on?" on":""}" data-a="togdiv" data-row="${i}" data-b="${b}"
    aria-pressed="${on}" title="${on?"Remove":"Add"} ${what}"></button>`;
}

function cellHTML(i,j,col){
  const c=col.c;
  let extra="";
  const sbField=`<div class="field"><label>Setback (cm)</label>
    <input type="number" step="0.5" min="0" value="${c.setback!=null?c.setback:0}" data-a="setback" data-row="${i}" data-col="${j}"></div>
    <div class="field"><label>Front border (cm)</label>
    <input type="number" step="0.5" min="0" value="${c.border!=null?c.border:0}" data-a="border" data-row="${i}" data-col="${j}"></div>`;
  const hingeField=()=>{
    const hg=c.hinge||"left";
    return `<div class="field"><label>Hinge side</label><select data-a="hinge" data-row="${i}" data-col="${j}">
      ${HINGES.map(h=>`<option value="${h[0]}"${hg===h[0]?" selected":""}>${h[1]}</option>`).join("")}</select></div>`;
  };
  const shField=`<div class="field"><label>Shelves</label>
    <input type="number" step="1" min="0" max="20" value="${Math.max(0,Math.floor(c.shelves||0))}" data-a="shelves" data-row="${i}" data-col="${j}"></div>`;
  const fpField = FACEPLATE_TYPES[c.type] ?
    `<label class="check fpcheck"><input type="checkbox" data-a="faceplate" data-row="${i}" data-col="${j}"${c.faceplate?" checked":""}>
     Part of face plate <small>(flush timber layer that hides framing &amp; wiring)</small></label>` : "";
  if(c.type==="open"){
    extra=`<div class="field"><label>Contents</label><select data-a="decor" data-row="${i}" data-col="${j}">
      ${DECOR.map(d=>`<option value="${d[0]}"${c.decor===d[0]?" selected":""}>${d[1]}</option>`).join("")}</select></div>${sbField}${shField}`;
  } else if(c.type==="door"){
    extra=hingeField()+shField;
  } else if(c.type==="door-push"){
    extra=hingeField()+shField;
  } else if(c.type==="tv"){
    const gapField=c.faceplate?`<div class="field"><label>Reveal gap (cm)</label>
      <input type="number" step="0.5" min="0" value="${c.tvGap!=null?c.tvGap:5}" data-a="tvgap" data-row="${i}" data-col="${j}"></div>`:"";
    extra=`<div class="field"><label>TV size</label><select data-a="tvsize" data-row="${i}" data-col="${j}">
      ${TVS.map(t=>`<option value="${t}"${c.tv===t?" selected":""}>${t}″</option>`).join("")}</select></div>${sbField}${gapField}`;
  } else if(c.type==="fireplace"){
    extra=sbField;
  } else if(c.type==="tv-panel"){
    extra=`<div class="field"><label>TV size</label><select data-a="tvsize" data-row="${i}" data-col="${j}">
      ${TVS.map(t=>`<option value="${t}"${c.tv===t?" selected":""}>${t}″</option>`).join("")}</select></div>
      <div class="field"><label>Border gap (cm)</label>
      <input type="number" step="0.5" min="0" value="${c.tvGap!=null?c.tvGap:5}" data-a="tvgap" data-row="${i}" data-col="${j}"></div>`;
  }
  extra += fpField;
  return `<div class="cell">
    <div class="ctop">
      <span class="celltag">${String.fromCharCode(65+j)}</span>
      <div class="field wsm"><label>Width</label>
        <input type="number" step="0.5" min="5" value="${col.w}" data-a="cellw" data-row="${i}" data-col="${j}"></div>
      <div class="field"><label>Type</label>
        <select data-a="celltype" data-row="${i}" data-col="${j}">
          ${CELL_TYPES.map(t=>`<option value="${t[0]}"${c.type===t[0]?" selected":""}>${t[1]}</option>`).join("")}
        </select></div>
    </div>
    ${extra?`<div class="extra">${extra}</div>`:""}
  </div>`;
}

function updateComputed(){
  const el=document.getElementById("computedBox");
  if(el) el.innerHTML =
    `Overall size&nbsp; <b>${fmt(S.unitWidth)} W × ${fmt(totalHeight())} H × ${fmt(S.depth)} D</b> cm<br>`+
    `Rows: <b>${S.rows.length}</b> · Niches: <b>${S.rows.reduce((a,r)=>a+r.cols.length,0)}</b>`;
}
function updateBadge(i){
  const el=document.querySelector(`[data-badge="${i}"]`);
  if(!el) return;
  const row=S.rows[i], avail=rowAvail(row), sum=rowSum(row);
  const ok=Math.abs(sum-avail)<0.06;
  el.className="badge "+(ok?"ok":"bad");
  el.textContent=`Σ ${fmt(sum)} / ${fmt(avail)} cm${ok?"":" → scaled"}`;
}

/* ---------- events (delegated) ---------- */
function rescaleRow(i){
  const row=S.rows[i], avail=rowAvail(row), sum=rowSum(row)||1;
  let acc=0;
  row.cols.forEach((c,k)=>{
    let w=Math.round(c.w*avail/sum*10)/10;
    if(k===row.cols.length-1) w=Math.round((avail-acc)*10)/10;
    c.w=Math.max(0.1,w); acc+=c.w;
  });
}
function rescaleAllRows(){ S.rows.forEach((_,i)=>rescaleRow(i)); }

controls.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.a==="cellw"){ // snap the edited field to its clamped value on blur
    const i=+t.dataset.row, j=+t.dataset.col;
    if(S.rows[i]&&S.rows[i].cols[j]) t.value=fmt(S.rows[i].cols[j].w);
  }
});

controls.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.g){
    if(t.type==="checkbox") S[t.dataset.g]=t.checked;
    else if(t.tagName==="SELECT") S[t.dataset.g]=t.value;
    else { const v=parseFloat(t.value);
      const zeroOK = t.dataset.g==="plinth"||t.dataset.g==="plinthRecess";
      if(!isNaN(v) && (v>0 || (zeroOK && v>=0))) S[t.dataset.g]=v; }
    if(t.dataset.g==="unitWidth"||t.dataset.g==="thickness"){
      rescaleAllRows();
      S.rows.forEach((_,i)=>syncRowWidthInputs(i,-1));
    }
    updateComputed(); S.rows.forEach((_,i)=>updateBadge(i)); scheduleRebuild(); return;
  }
  const i=+t.dataset.row, j=+t.dataset.col;
  switch(t.dataset.a){
    case "rowname": S.rows[i].name=t.value; scheduleRebuild(); break;
    case "rowh":{ const v=parseFloat(t.value); if(!isNaN(v)&&v>=5){S.rows[i].height=v; updateComputed(); scheduleRebuild();} break;}
    case "cellw":{ const v=parseFloat(t.value);
      if(!isNaN(v)&&v>0){ setColumnWidth(i,j,v); syncRowWidthInputs(i,j); updateBadge(i); scheduleRebuild(); } break;}
    case "celltype": S.rows[i].cols[j].c.type=t.value; renderSidebar(); scheduleRebuild(); break;
    case "decor": S.rows[i].cols[j].c.decor=t.value; scheduleRebuild(); break;
    case "hinge": S.rows[i].cols[j].c.hinge=t.value; scheduleRebuild(); break;
    case "tvsize": S.rows[i].cols[j].c.tv=+t.value; scheduleRebuild(); break;
    case "tvgap":{ const v=parseFloat(t.value); if(!isNaN(v)&&v>=0){S.rows[i].cols[j].c.tvGap=v; scheduleRebuild();} break;}
    case "setback":{ const v=parseFloat(t.value); if(!isNaN(v)&&v>=0){S.rows[i].cols[j].c.setback=v; scheduleRebuild();} break;}
    case "border":{ const v=parseFloat(t.value); if(!isNaN(v)&&v>=0){S.rows[i].cols[j].c.border=v; scheduleRebuild();} break;}
    case "shelves":{ const v=parseInt(t.value,10); if(!isNaN(v)&&v>=0&&v<=20){S.rows[i].cols[j].c.shelves=v; scheduleRebuild();} break;}
    case "faceplate": S.rows[i].cols[j].c.faceplate=t.checked; renderSidebar(); scheduleRebuild(); break;
  }
});
controls.addEventListener("click", e=>{
  const head=e.target.closest(".rhead");
  if(head && !e.target.closest("button") && !e.target.closest("input,select")){
    const ri=+head.parentElement.dataset.row;
    expandedRow = (expandedRow===ri) ? null : ri;
    renderSidebar(); return;
  }
  const b=e.target.closest("button"); if(!b||!b.dataset.a) return;
  const i=+b.dataset.row;
  switch(b.dataset.a){
    case "togdiv":{
      const row=S.rows[i]; ensureDividers(row);
      const bi=+b.dataset.b;
      row.dividers[bi]=!row.dividers[bi];
      rescaleRow(i); break;}
    case "addrow":{ const r={name:"", height:35, cols:[{w:0,c:newCell("open")},{w:0,c:newCell("open")}]};
      S.rows.push(r); equalizeRow(S.rows.length-1,true); expandedRow=S.rows.length-1; break;}
    case "delrow": S.rows.splice(i,1);
      if(expandedRow===i) expandedRow=null; else if(expandedRow>i) expandedRow--; break;
    case "rowup": [S.rows[i],S.rows[i+1]]=[S.rows[i+1],S.rows[i]];
      if(expandedRow===i) expandedRow=i+1; else if(expandedRow===i+1) expandedRow=i; break;
    case "rowdown": [S.rows[i],S.rows[i-1]]=[S.rows[i-1],S.rows[i]];
      if(expandedRow===i) expandedRow=i-1; else if(expandedRow===i-1) expandedRow=i; break;
    case "addcol": S.rows[i].cols.push({w:0,c:newCell("open")}); equalizeRow(i,true); break;
    case "delcol": S.rows[i].cols.pop(); equalizeRow(i,true); break;
    case "equalize": equalizeRow(i,true); break;
    case "reset": S=defaultState(); S.rows.forEach((_,k)=>equalizeRow(k,true)); expandedRow=S.rows.length-1; break;
    case "clearsave":{
      if(!confirm("Delete the saved design from this browser and load the example? Export it as JSON first if you want to keep it.")) return;
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      S=defaultState(); S.rows.forEach((_,k)=>equalizeRow(k,true)); expandedRow=S.rows.length-1; break;}
    case "export": exportJSON(); return;
    case "import": document.getElementById("fileImport").click(); return;
    case "paste": showPasteImport(); return;
    default: return;
  }
  renderSidebar(); scheduleRebuild();
});

function showPasteImport(){
  const old=document.getElementById("exportModal"); if(old) old.remove();
  const wrap=document.createElement("div");
  wrap.id="exportModal";
  wrap.innerHTML=`
    <div class="emcard">
      <h3>Paste design</h3>
      <p>Paste previously exported JSON here to load that design. This replaces your current one.</p>
      <textarea id="emText" spellcheck="false" placeholder='{ "unitWidth": 320, ... }'></textarea>
      <div class="embtns">
        <button class="primary" id="emLoad">Load design</button>
        <button id="emClose">Cancel</button>
      </div>
      <div id="emErr" class="emerr"></div>
    </div>`;
  document.body.appendChild(wrap);
  const ta=wrap.querySelector("#emText"); ta.focus();
  wrap.querySelector("#emClose").addEventListener("click",()=>wrap.remove());
  wrap.addEventListener("click",e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector("#emLoad").addEventListener("click",()=>{
    const err=wrap.querySelector("#emErr");
    try{
      const d=JSON.parse(ta.value);
      if(!d || !d.rows || !d.unitWidth){ err.textContent="That doesn't look like a Cinewall design."; return; }
      S=migrateDesign(d);
      expandedRow=S.rows.length?S.rows.length-1:null;
      wrap.remove(); renderSidebar(); scheduleRebuild();
    }catch(e){ err.textContent="Couldn't read that: "+e.message; }
  });
}

function exportJSON(){
  const json=JSON.stringify(S,null,2);
  let ok=false;
  try{
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="cinewall-design.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    ok=true;
  }catch(e){ ok=false; }
  // sandboxed previews block blob downloads ("This content is blocked") — offer copy/paste instead
  showExportFallback(json, ok);
}

function showExportFallback(json, downloadTried){
  const old=document.getElementById("exportModal"); if(old) old.remove();
  const wrap=document.createElement("div");
  wrap.id="exportModal";
  wrap.innerHTML=`
    <div class="emcard">
      <h3>Export design</h3>
      <p>${downloadTried
        ? "A download should have started. If your browser blocked it (common in embedded previews), copy the design below and save it as <code>cinewall-design.json</code>."
        : "Download isn't available here. Copy the design below and save it as <code>cinewall-design.json</code>."}</p>
      <textarea id="emText" spellcheck="false" readonly></textarea>
      <div class="embtns">
        <button class="primary" id="emCopy">Copy to clipboard</button>
        <button id="emClose">Close</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const ta=wrap.querySelector("#emText");
  ta.value=json;
  wrap.querySelector("#emClose").addEventListener("click",()=>wrap.remove());
  wrap.addEventListener("click",e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector("#emCopy").addEventListener("click",()=>{
    const btn=wrap.querySelector("#emCopy");
    const done=()=>{ btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent="Copy to clipboard",1600); };
    ta.select(); ta.setSelectionRange(0,json.length);
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(json).then(done).catch(()=>{ try{document.execCommand("copy");}catch(e){} done(); });
    else { try{document.execCommand("copy");}catch(e){} done(); }
  });
}
document.getElementById("fileImport").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(d && d.rows && d.unitWidth){ S=migrateDesign(d); expandedRow=S.rows.length?S.rows.length-1:null; renderSidebar(); scheduleRebuild(); }
      else alert("This file is not a Cinewall design.");
    }catch(err){ alert("Could not read this file: "+err.message); } };
  r.readAsText(f); e.target.value="";
});

/* ---------- materials ---------- */
function woodCanvas(base,streak){
  const cv=document.createElement("canvas"); cv.width=cv.height=256;
  const g=cv.getContext("2d");
  g.fillStyle=base; g.fillRect(0,0,256,256);
  for(let i=0;i<70;i++){
    g.strokeStyle=streak; g.globalAlpha=0.06+Math.random()*0.10;
    g.lineWidth=1+Math.random()*2.5;
    const y=Math.random()*256; g.beginPath();
    g.moveTo(0,y);
    g.bezierCurveTo(85,y+(Math.random()*10-5),170,y+(Math.random()*10-5),256,y+(Math.random()*8-4));
    g.stroke();
  }
  g.globalAlpha=1;
  const tx=new THREE.CanvasTexture(cv);
  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  return tx;
}
function slatCanvas(){ // vertical acoustic wood slats on a dark backing
  const cv=document.createElement("canvas"); cv.width=cv.height=256;
  const g=cv.getContext("2d");
  g.fillStyle="#181310"; g.fillRect(0,0,256,256);
  const slat=12, gapp=4, tones=["#5d4230","#654936","#57402e","#6b4d38"];
  for(let x=0;x<256;x+=slat+gapp){
    g.fillStyle=tones[Math.floor(Math.random()*tones.length)];
    g.fillRect(x,0,slat,256);
    g.strokeStyle="#2b1e14";
    for(let i=0;i<3;i++){
      g.globalAlpha=0.25; g.lineWidth=0.8;
      const gx=x+2+Math.random()*(slat-4);
      g.beginPath(); g.moveTo(gx,0); g.lineTo(gx+(Math.random()*2-1)*3,256); g.stroke();
    }
    g.globalAlpha=1;
  }
  const tx=new THREE.CanvasTexture(cv);
  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  return tx;
}
function concreteCanvas(){ // mottled microcement
  const cv=document.createElement("canvas"); cv.width=cv.height=256;
  const g=cv.getContext("2d");
  g.fillStyle="#9b9b98"; g.fillRect(0,0,256,256);
  for(let i=0;i<380;i++){
    const v=140+Math.floor(Math.random()*40);
    g.fillStyle=`rgb(${v},${v},${v-2})`;
    g.globalAlpha=0.05+Math.random()*0.07;
    g.beginPath(); g.arc(Math.random()*256,Math.random()*256,4+Math.random()*18,0,Math.PI*2); g.fill();
  }
  g.globalAlpha=1;
  for(let i=0;i<60;i++){ // fine speckles
    g.fillStyle="rgba(90,90,88,0.25)";
    g.fillRect(Math.random()*256,Math.random()*256,1.2,1.2);
  }
  const tx=new THREE.CanvasTexture(cv);
  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  return tx;
}
function marbleCanvas(){ // white marble with soft grey veining
  const cv=document.createElement("canvas"); cv.width=cv.height=256;
  const g=cv.getContext("2d");
  g.fillStyle="#eae8e3"; g.fillRect(0,0,256,256);
  for(let i=0;i<9;i++){
    g.strokeStyle=i%3===0?"#a9a59b":"#c8c5bd";
    g.lineWidth=0.7+Math.random()*1.6;
    g.globalAlpha=0.35+Math.random()*0.3;
    const y=Math.random()*256, drift=()=>Math.random()*70-35;
    g.beginPath(); g.moveTo(-10,y);
    g.bezierCurveTo(70,y+drift(),150,y+drift(),266,y+drift());
    g.stroke();
  }
  g.globalAlpha=1;
  const tx=new THREE.CanvasTexture(cv);
  tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  return tx;
}
const FIN={
